# =============================================================================
# RETINA - Multi-Stage Visual Anomaly Detection System
# Docker Compose Configuration
# =============================================================================
#
# This file predates the FastAPI demo path (see README.md "Architecture" /
# "Design Rationale"). The demo runs api/ + worker/ + frontend/ natively,
# not via this compose file — api/ has no Dockerfile or service entry here.
# The Rust backend this file once wired has been removed from the repo
# (see docs/DECISIONS.md entry 14); postgres and worker below are what
# remain, kept for reference if a containerized deployment is built later.
#
# Communication Patterns (worker/redis, as actually implemented):
# - Worker ← Redis: Job consumption (XREADGROUP on retina:jobs:queue)
# - Worker → Redis: Result storage (HSET retina:results:{job_id})
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Persistent Database (Matching Professor's Framework)
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - User accounts (authentication)
  # - Anomaly records (full lifecycle tracking)
  # - Expert labels and classifications
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: retina-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=retina
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=retina
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retina -d retina"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - retina-network

  # ---------------------------------------------------------------------------
  # Redis - Message Broker & State Store
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - Inference job queue (Redis Streams)
  # - Result caching (Redis Hashes)
  # - Active learning sample pool (Redis Sorted Sets)
  # - Real-time alerts (Redis Lists)
  # - System state & metrics (Redis Hashes)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: retina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - retina-network

  # ---------------------------------------------------------------------------
  # ML Worker - Inference Engine (Python)
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - Consume inference jobs from Redis queue (XREADGROUP)
  # - Identify product (gpt-4o-mini), run per-category PatchCore, refine
  #   ambiguous scores via GPT-4o (see worker/src/retina_worker/worker.py)
  # - Store results back to Redis, add uncertain samples to the AL pool
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: retina-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=2
      - DEFAULT_UNSUPERVISED_MODEL=patchcore
      - DEBUG_MODE=false
      - MOCK_INFERENCE_DELAY_MS=0
      # GPT-4V: reads from .env file via ${OPENAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT4V_PRODUCT_TYPE=${GPT4V_PRODUCT_TYPE:-manufactured product}
      - GPT4V_MAX_RETRIES=3
      # PatchCore: path inside container (matches volume mount below)
      - PATCHCORE_CHECKPOINT_PATH=/data/models/patchcore
    volumes:
      - image-data:/data/images
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('redis://redis:6379'); r.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Scale workers for parallel inference:
    # docker compose up --scale worker=4
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - retina-network

  # ---------------------------------------------------------------------------
  # Frontend - User Interface (Next.js)
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - System dashboard & monitoring
  # - Image submission interface
  # - Results visualization
  # - Active learning labeling interface
  #
  # Users:
  # - Engineers: System monitoring, batch submissions
  # - Domain Experts: Sample labeling, defect categorization
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retina-frontend
    ports:
      - "3000:3000"
    environment:
      # No containerized backend exists in this compose file (see the
      # architecture note at the top). Set this to wherever api/main.py
      # is actually running.
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - retina-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  image-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  retina-network:
    driver: bridge
