# =============================================================================
# RETINA - Multi-Stage Visual Anomaly Detection System
# Docker Compose Configuration
# =============================================================================
#
# This file predates the FastAPI demo path (see README.md "Architecture" /
# "Design Rationale"). The demo runs api/ + worker/ + frontend/ natively,
# not via this compose file — api/ has no Dockerfile or service entry here.
# The Rust backend this file once wired has been removed from the repo
# (see docs/DECISIONS.md entry 14). The postgres service has also been
# removed: Redis with TTL is the only persistence layer (DECISIONS.md
# entry 10), and nothing in api/ or worker/ ever connected to it.
#
# Communication Patterns (worker/redis, as actually implemented):
# - Worker ← Redis: Job consumption (XREADGROUP on retina:jobs:queue)
# - Worker → Redis: Result storage (HSET retina:results:{job_id})
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Redis - Message Broker & State Store
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - Inference job queue (Redis Streams)
  # - Result caching (Redis Hashes)
  # - Active learning sample pool (Redis Sorted Sets)
  # - Real-time alerts (Redis Lists)
  # - System state & metrics (Redis Hashes)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: retina-redis
    # Bound to loopback only — never expose the cache/queue to the LAN.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # redis-cli picks this up automatically, so the healthcheck below
      # authenticates without repeating the password on its command line.
      - REDISCLI_AUTH=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - retina-network

  # ---------------------------------------------------------------------------
  # ML Worker - Inference Engine (Python)
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - Consume inference jobs from Redis queue (XREADGROUP)
  # - Identify product (gpt-4o-mini), run per-category PatchCore, refine
  #   ambiguous scores via GPT-4o (see worker/src/retina_worker/worker.py)
  # - Store results back to Redis, add uncertain samples to the AL pool
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: retina-worker
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - WORKER_CONCURRENCY=2
      - DEFAULT_UNSUPERVISED_MODEL=patchcore
      - DEBUG_MODE=false
      - MOCK_INFERENCE_DELAY_MS=0
      # GPT-4V: reads from .env file via ${OPENAI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GPT4V_PRODUCT_TYPE=${GPT4V_PRODUCT_TYPE:-manufactured product}
      - GPT4V_MAX_RETRIES=3
      # Directory of per-category patchcore_{category}.ckpt files, read by
      # Settings.resolved_checkpoint_dir(). Absolute on purpose: the repo
      # layout the native default derives from does not exist in the image,
      # and this must not depend on the container's working directory.
      # Note the checkpoints still need mounting in for this to resolve.
      - PATCHCORE_CHECKPOINT_PATH=${PATCHCORE_CHECKPOINT_PATH:-/data/checkpoints}
      # Mount point for the shared image store. The API resolves the same
      # image_id against its own root (natively: ./data/images) and this
      # container resolves it against this one. Same relative layout below
      # the root, so no absolute path ever crosses the boundary.
      - RETINA_IMAGE_ROOT=/data/images
    volumes:
      # Bind mount, NOT a named volume. api/main.py runs natively (it has no
      # service here), so a named volume would be invisible to it and the
      # worker would receive ids whose bytes it cannot see. Binding the same
      # host directory is what makes the native-API / containerized-worker
      # split actually work.
      - ./data/images:/data/images
      # Read-only: the worker loads checkpoints, it never writes them.
      - ./checkpoints:/data/checkpoints:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Scale workers for parallel inference:
    # docker compose up --scale worker=4
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - retina-network

  # ---------------------------------------------------------------------------
  # Frontend - User Interface (Next.js)
  # ---------------------------------------------------------------------------
  # Responsibilities:
  # - System dashboard & monitoring
  # - Image submission interface
  # - Results visualization
  # - Active learning labeling interface
  #
  # Users:
  # - Engineers: System monitoring, batch submissions
  # - Domain Experts: Sample labeling, defect categorization
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retina-frontend
    ports:
      - "3000:3000"
    environment:
      # No containerized backend exists in this compose file (see the
      # architecture note at the top). Set this to wherever api/main.py
      # is actually running.
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - retina-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  # image-data removed: the image store is a bind mount of ./data/images so
  # the natively-run API and the containerized worker share one directory.

# =============================================================================
# Networks
# =============================================================================
networks:
  retina-network:
    driver: bridge
