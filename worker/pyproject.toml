# =============================================================================
# RETINA ML Worker - Project Configuration
# =============================================================================
#
# Python package for the ML inference worker that processes anomaly detection
# jobs from the Redis queue.
#
# Current Status:
# - Model inference uses deterministic stubs for testing
# - Real model integration via Anomalib framework
# - Push-pull contrastive learning for Stage 2
#
# =============================================================================

[project]
name = "retina-worker"
version = "0.1.0"
description = "ML inference worker for the RETINA multi-stage anomaly detection system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = []
keywords = ["anomaly-detection", "machine-learning", "active-learning", "industrial-inspection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------
# Core dependencies for the worker. ML model dependencies (torch, anomalib)
# are listed but may need adjustment based on the target deployment environment.
# -----------------------------------------------------------------------------
dependencies = [
    # Redis client for job queue consumption
    # Pinned exactly: 8.x changed how an expired BLOCK on a consumer-group
    # read is reported (TimeoutError instead of an empty list), and an
    # unpinned range resolved to 7.4.0 natively against 8.1.0 in the
    # container — the same code logging an idle queue two different ways.
    "redis==8.1.0",

    # Data validation and settings management
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Image processing
    "pillow>=10.0.0",
    "numpy>=1.24.0",

    # HTTP client (for callbacks and health checks)
    "httpx>=0.27.0",

    # Structured logging
    "structlog>=24.0.0",

    # Environment variable loading
    "python-dotenv>=1.0.0",

    # OpenAI SDK — required for GPT-4V zero-shot detector
    "openai>=1.0.0",

    # PyTorch — required for PatchCore real implementation
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",

    # Anomalib — production-grade PatchCore/PaDiM training pipeline.
    # Pinned exactly: checkpoint loading is version-sensitive, and 2.3.3 is
    # what produced the checkpoints in checkpoints/ and what README.md's
    # benchmark methodology records. The previous <2.0.0 constraint resolved
    # to 1.2.0 in the container, a different major version from the one this
    # project actually runs natively.
    "anomalib==2.3.3",

    # anomalib 2.x ships a deliberately minimal base install and does not
    # pull in the training framework itself, so the worker has to ask for it
    # explicitly — without this the container dies at import with
    # ModuleNotFoundError: No module named 'lightning'.
    "lightning>=2.2.0,<3.0.0",
]

# -----------------------------------------------------------------------------
# Optional Dependencies
# -----------------------------------------------------------------------------
[project.optional-dependencies]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.38.0",
    "mypy==2.3.1",
    "ruff==0.15.7",
]

[project.scripts]
retina-worker = "retina_worker.main:main"

# -----------------------------------------------------------------------------
# Build System
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retina_worker"]

# -----------------------------------------------------------------------------
# Tool Configurations
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# vlm_router.py embeds the JSON response schema it sends to GPT-4o as a
# string literal, and one enumeration line exceeds the limit. Rewrapping it
# would change the prompt text the model actually receives — a behavioural
# change to satisfy a cosmetic rule, and one no offline test could catch
# since the prompts are only exercised by the billed integration suite.
# This file went unlinted until the .gitignore rules were anchored (B1),
# because ruff honours .gitignore and `models/` matched this directory.
"src/retina_worker/models/vlm_router.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests either spend real money on OpenAI calls or need the
# ~230 MB checkpoints, so a bare `python -m pytest` runs the offline unit
# suite only. Run the rest deliberately with `-m integration`.
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: needs a live OpenAI key or on-disk PatchCore checkpoints (billed/slow)",
]
